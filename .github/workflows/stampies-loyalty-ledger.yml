name: Stampies Loyalty Ledger

on:
  pull_request:
    paths:
      - 'server/loyalty/**'
      - 'server/auth/**'
      - 'tests/loyalty-ledger*.test.mjs'
      - 'tests/fixtures/merchant-identities.pr5.sql'
      - '.github/workflows/stampies-loyalty-ledger.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loyalty-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify domain, SQL grants and actual restricted-runtime transactions
        run: node --test tests/loyalty-ledger*.test.mjs
