name: Stampies Isolated Loyalty Host

on:
  pull_request:
    paths:
      - 'server/api/**'
      - 'server/auth/**'
      - 'server/loyalty/**'
      - 'tests/loyalty-host*.test.mjs'
      - 'tests/merchant-auth.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stampies-loyalty-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test raw loopback transport and actual restricted-pool composition
        run: node --test --test-concurrency=1 --test-timeout=70000 tests/loyalty-host*.test.mjs tests/merchant-auth.test.mjs
