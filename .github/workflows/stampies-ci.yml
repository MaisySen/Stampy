name: Stampies CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stampies-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: '1'
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --no-deps -r scripts/requirements-ci.txt
      - name: Test and bundle for iOS and Android
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run scan
          node --experimental-sqlite --test \
            tests/wallet-server.test.mjs \
            tests/wallet-service.test.mjs \
            tests/wallet-http.test.mjs \
            tests/wallet-stamp-intake.test.mjs \
            tests/wallet-google-updates.test.mjs \
            tests/wallet-push-worker.test.mjs
          python3 scripts/make-assets.py
          node scripts/check-ci-config.mjs
          ./node_modules/.bin/expo export --platform android --max-workers 2 --output-dir dist/ci-android
          ./node_modules/.bin/expo export --platform ios --max-workers 2 --output-dir dist/ci-ios
